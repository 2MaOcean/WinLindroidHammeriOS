set timeout=3
set default=0

# 初始化串口（COM1, 115200 波特率）
serial --unit=0 --speed=115200
# 让 GRUB 同时在屏幕和串口输出/接收
terminal_input console serial
terminal_output console serial

menuentry "WinLindroidHammeriOS P1" {
    insmod all_video
    set gfxpayload=text
    multiboot2 /boot/wlhios-kernel.elf
    boot
}
